<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catan Board</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4efe4;--panel:#fffaf0;--text:#2a2118;--muted:#7a6b58;--line:#d9ccb4;--sea:#7fb6d9;--btn:#efe3c8;--accent:#b4531f;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--panel:#241e17;--text:#f1e8d8;--muted:#a89880;--line:#40372b;--sea:#1d4468;--btn:#352c20;--accent:#e58a4b;}}
:root[data-theme="dark"]{--bg:#17130f;--panel:#241e17;--text:#f1e8d8;--muted:#a89880;--line:#40372b;--sea:#1d4468;--btn:#352c20;--accent:#e58a4b;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{padding:12px 16px;display:flex;gap:12px;align-items:center}
h1{font-size:20px;margin:0;flex:1}
main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;padding:0 14px 20px;max-width:1800px;margin:auto}
@media(max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
button{font:inherit;color:var(--text);background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.on,button.big{background:var(--accent);color:#fff;border-color:var(--accent)}
button.big{font-weight:700;padding:12px;width:100%}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.row>button{flex:1 1 auto}
#boardwrap{background:var(--sea);border-radius:16px;padding:4px}
svg{width:100%;height:auto;max-height:calc(100vh - 150px);min-height:480px;display:block;touch-action:manipulation}
.dice{display:flex;align-items:center;gap:10px}
.die{font-size:60px;line-height:1;user-select:none}
.die.roll{animation:sh .12s infinite}
@keyframes sh{50%{transform:rotate(12deg) scale(1.08)}}
#sum{font-size:32px;font-weight:700;min-width:50px;text-align:center}
.turn{border-left:10px solid;font-size:17px;font-weight:700}
.pl{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;border:2px solid transparent}
.pl.cur{border-color:var(--accent);background:var(--btn)}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid #0006}
.small{font-size:12px;color:var(--muted);line-height:1.5}
.vp{font-size:26px;font-weight:700}
#msg{min-height:20px;font-size:14px}
</style>
</head>
<body>
<header><h1>🏝️ Catan Board Companion</h1><button data-act="newgame">New game</button></header>
<main>
<div><div id="boardwrap"><svg id="board" viewBox="-255 -265 510 530" role="img" aria-label="Catan board"></svg></div>
<div class="card" style="margin-top:10px"><div id="msg"></div></div></div>
<div style="display:grid;gap:12px;align-content:start"><div class="card"><label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="names"> Show resource names under the icons</label></div><div id="side" style="display:grid;gap:12px;align-content:start"></div></div>
</main>
<script>
const S=50,R3=Math.sqrt(3),$=s=>document.querySelector(s);
const RES={wood:{c:'#2f7d3a',e:'🌲'},brick:{c:'#c2603a',e:'🧱'},sheep:{c:'#9ccc65',e:'🐑'},wheat:{c:'#e9c446',e:'🌾'},ore:{c:'#8a94a0',e:'⛰️'},desert:{c:'#e3cf9a',e:'🏜️'}};
const STD={wood:4,brick:3,sheep:4,wheat:4,ore:3,desert:1};
const PL=[{n:'Red',c:'#d6322f'},{n:'Blue',c:'#2563eb'},{n:'Orange',c:'#f08a1c'},{n:'White',c:'#f5f5f5'}];
const LIM={road:15,settlement:5,city:4},FACE='⚀⚁⚂⚃⚄⚅';
const REC=[['wheat',9],['wood',8],['brick',5],['wheat',12],['wood',11],['ore',3],['wheat',6],['ore',10],['brick',6],['desert',0],['wheat',4],['sheep',11],['sheep',2],['sheep',4],['wood',3],['sheep',5],['wood',9],['brick',10],['ore',8]];
// geometry
const hexes=[],V=new Map(),E=new Map(),vk=(x,y)=>Math.round(x)+','+Math.round(y);
for(let q=-2;q<=2;q++)for(let r=-2;r<=2;r++){if(Math.abs(q+r)>2)continue;
 const h={x:S*R3*(q+r/2),y:S*1.5*r,v:[],i:hexes.length};hexes.push(h);const cs=[];
 for(let i=0;i<6;i++){const a=(60*i-30)*Math.PI/180,x=h.x+S*Math.cos(a),y=h.y+S*Math.sin(a),k=vk(x,y);
  if(!V.has(k))V.set(k,{k,x,y,ed:[]});cs.push(k);h.v.push(k)}
 for(let i=0;i<6;i++){const a=cs[i],b=cs[(i+1)%6],k=[a,b].sort().join('|');
  if(!E.has(k)){E.set(k,{k,a,b,n:0});V.get(a).ed.push(k);V.get(b).ed.push(k)}E.get(k).n++}}
const nbrV=k=>V.get(k).ed.map(e=>{const d=E.get(e);return d.a===k?d.b:d.a});
const coast=[...E.values()].filter(e=>e.n===1).map(e=>{const A=V.get(e.a),B=V.get(e.b);e.mx=(A.x+B.x)/2;e.my=(A.y+B.y)/2;return e}).sort((a,b)=>Math.atan2(a.my,a.mx)-Math.atan2(b.my,b.mx));
const hEdges=Array.from({length:9},(_,i)=>coast[Math.floor(i*coast.length/9+.5)%coast.length]);
// state
let st={phase:'config',n:4,tiles:[],harbors:[],robber:9,sel:null,tool:'road',cur:0,roads:{},bld:{},kn:[],lr:-1,la:-1,len:[],dice:[1,1],rolled:false,rob:null,kp:false,hl:null,col:'',hist:[],seq:[],si:0,step:'village',lastV:null,over:false};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const say=t=>$('#msg').textContent=t;
function desertIdx(){const i=st.tiles.findIndex(t=>t.r==='desert');return i<0?9:i}
function recommended(){st.tiles=REC.map(([r,n])=>({r,n}));st.robber=9;st.sel=null}
function randomTiles(){const res=shuffle(Object.entries(STD).filter(([k])=>k!=='desert').flatMap(([k,v])=>Array(v).fill(k))),nums=[2,3,3,4,4,5,5,6,6,8,8,9,9,10,10,11,11,12];let t;
 for(let a=0;a<200;a++){shuffle(nums);let k=0;t=hexes.map(h=>h.i===9?{r:'desert',n:0}:{r:res[k],n:nums[k++]});
  const hot=hexes.filter(h=>[6,8].includes(t[h.i].n));if(!hot.some((p,i)=>hot.some((q,j)=>j>i&&Math.hypot(p.x-q.x,p.y-q.y)<S*R3+1)))break}
 st.tiles=t;st.robber=9;st.sel=null}
function resetPlay(){Object.assign(st,{roads:{},bld:{},kn:[0,0,0,0],lr:-1,la:-1,len:[],rolled:false,rob:null,kp:false,hl:null,col:'',hist:[],over:false,dice:[1,1]})}
function newGame(){st.phase='config';st.harbors=shuffle(['3:1','3:1','3:1','3:1','wood','brick','sheep','wheat','ore']);resetPlay();recommended();
 say('Choose the number of players and set up the land tiles. A recommended layout is already loaded.');render()}
function start(){st.robber=9;st.phase='setup';resetPlay();const o=[...Array(st.n).keys()];st.seq=[...o,...o.reverse()];st.si=0;st.cur=st.seq[0];st.step='village';st.tool='settlement';st.sel=null;
 say(`${PL[st.cur].n}: place your first village anywhere on a corner.`);render()}
// rules
const cnt=(p,t)=>t==='road'?Object.values(st.roads).filter(x=>x===p).length:Object.values(st.bld).filter(b=>b.p===p&&b.t===t).length;
function canSettle(k,p){
 if(st.bld[k])return'That corner is already taken.';
 if(nbrV(k).some(n=>st.bld[n]))return'Too close to another village (distance rule: at least 2 roads apart).';
 if(st.phase==='setup')return'';
 if(cnt(p,'settlement')>=LIM.settlement)return'No village pieces left (max 5). Upgrade a village to a city instead.';
 if(!V.get(k).ed.some(e=>st.roads[e]===p))return'A new village must touch one of your own roads.';return''}
function canCity(k,p){const b=st.bld[k];
 if(!b||b.p!==p||b.t!=='settlement')return'Tap one of your own villages to upgrade it.';
 if(cnt(p,'city')>=LIM.city)return'No city pieces left (max 4).';return''}
function canRoad(k,p){const e=E.get(k);
 if(st.roads[k]!==undefined)return'There is already a road there.';
 if(st.phase==='setup')return(e.a===st.lastV||e.b===st.lastV)?'':'Your starting road must touch the village you just placed.';
 if(cnt(p,'road')>=LIM.road)return'No road pieces left (max 15).';
 return[e.a,e.b].some(v=>{const b=st.bld[v];if(b)return b.p===p;return V.get(v).ed.some(x=>x!==k&&st.roads[x]===p)})?'':'A road must connect to your own road, village or city (and can’t pass through an opponent’s village).'}
function longest(p){const blocked=v=>st.bld[v]&&st.bld[v].p!==p;
 const dfs=(v,used)=>{let m=0;for(const e of V.get(v).ed){if(st.roads[e]!==p||used.has(e))continue;const d=E.get(e),w=d.a===v?d.b:d.a;used.add(e);m=Math.max(m,1+(blocked(w)?0:dfs(w,used)));used.delete(e)}return m};
 let b=0;V.forEach(v=>b=Math.max(b,dfs(v.k,new Set())));return b}
function awards(){const L=[...Array(st.n).keys()].map(longest),K=st.kn.slice(0,st.n);
 const pick=(a,min,c)=>{const m=Math.max(...a);if(m<min)return-1;const ld=a.map((v,i)=>v===m?i:-1).filter(i=>i>=0);return ld.includes(c)?c:ld.length===1?ld[0]:-1};
 st.lr=pick(L,5,st.lr);st.la=pick(K,3,st.la);st.len=L}
const score=p=>cnt(p,'settlement')+2*cnt(p,'city')+(st.lr===p?2:0)+(st.la===p?2:0);
function gain(k){const g={};hexes.forEach(h=>{if(h.v.includes(k)&&st.tiles[h.i].r!=='desert'){const r=st.tiles[h.i].r;g[r]=(g[r]||0)+1}});return Object.entries(g).map(([r,v])=>RES[r].e+' ×'+v).join(', ')}
// actions
function act(kind,k){
 if(st.phase==='config'){if(kind==='h'){st.sel=+k;render()}return}
 if(st.over)return;
 if(kind==='h'){if(!st.rob)return;if(+k===st.robber)return say('The robber must move to a different tile.');
  st.robber=+k;st.rob=null;const vs=new Set();hexes[k].v.forEach(v=>{const b=st.bld[v];if(b&&b.p!==st.cur)vs.add(PL[b.p].n)});
  say(vs.size?`Robber moved. ${PL[st.cur].n} steals one random card from: ${[...vs].join(', ')}.`:'Robber moved. Nobody is next to it, so nothing to steal.');return render()}
 const t=st.tool;
 if(st.phase==='play'){if(!st.rolled)return say('Roll the dice first.');if(st.rob)return say('Move the robber first.')}
 let err='';const p=st.cur;
 if(kind==='v'&&t==='settlement'){err=canSettle(k,p);if(!err){st.bld[k]={p,t:'settlement'};st.hist.push(['b',k])}}
 else if(kind==='v'&&t==='city'){err=canCity(k,p);if(!err){st.bld[k].t='city';st.hist.push(['c',k])}}
 else if(kind==='e'&&t==='road'){err=canRoad(k,p);if(!err){st.roads[k]=p;st.hist.push(['r',k])}}
 else return say(st.phase==='setup'?`Place your ${st.step==='village'?'village on a corner':'road on an edge'}.`:'Pick the matching tool first (Road, Village or City).');
 if(err)return say(err);
 awards();
 if(st.phase==='setup'){
  if(st.step==='village'){st.lastV=k;st.step='road';st.tool='road';
   say(`${PL[p].n}: now place a road touching that village.`+(st.si>=st.n?` (Second village: take ${gain(k)||'no cards'}.)`:''))}
  else{st.si++;st.hist=[];if(st.si>=st.seq.length){st.phase='play';st.cur=0;st.tool='road';say('Setup complete! Red starts. Roll the dice.')}
   else{st.cur=st.seq[st.si];st.step='village';st.tool='settlement';say(`${PL[st.cur].n}: place your ${st.si>=st.n?'second':'first'} village.`)}}}
 else say(`${PL[p].n} built a ${t==='settlement'?'village':t}.`);
 render()}
function undo(){if(!st.hist.length||st.over)return say('Nothing to undo this turn.');
 const[t,k]=st.hist.pop();if(t==='r')delete st.roads[k];else if(t==='b')delete st.bld[k];else st.bld[k].t='settlement';
 if(st.phase==='setup'){st.step='village';st.tool='settlement'}awards();say('Last build undone.');render()}
function roll(){const d1=$('#d1'),d2=$('#d2'),b=$('[data-act=roll]');d1.classList.add('roll');d2.classList.add('roll');b.disabled=true;let n=0;
 const iv=setInterval(()=>{d1.textContent=FACE[Math.random()*6|0];d2.textContent=FACE[Math.random()*6|0];
  if(++n>9){clearInterval(iv);const a=1+(Math.random()*6|0),c=1+(Math.random()*6|0),s=a+c;st.dice=[a,c];st.rolled=true;st.hl=s===7?null:s;
   if(s===7){st.rob='seven';st.col='<b>7 – Robber!</b> Anyone holding more than 7 cards discards half. Then '+PL[st.cur].n+' taps a tile to move the robber.';say('Tap a tile to move the robber.')}
   else{const got={};hexes.forEach(h=>{const t=st.tiles[h.i];if(t.n!==s||st.robber===h.i)return;h.v.forEach(k=>{const b=st.bld[k];if(!b)return;got[b.p]=got[b.p]||{};got[b.p][t.r]=(got[b.p][t.r]||0)+(b.t==='city'?2:1)})});
    const L=Object.entries(got).map(([p,r])=>`<b>${PL[p].n}</b>: `+Object.entries(r).map(([k,v])=>RES[k].e+' ×'+v).join(', '));
    st.col=`<b>Rolled ${s}.</b> `+(L.length?'Collect:<br>'+L.join('<br>'):'Nobody collects anything.');say('Now build, trade, or end your turn.')}
   render()}},70)}
function knight(){if(st.kp)return say('Only one Knight card per turn.');st.kp=true;st.kn[st.cur]++;st.rob='knight';awards();say(PL[st.cur].n+' played a Knight. Tap a tile to move the robber.');render()}
function endTurn(){if(!st.rolled)return say('Roll the dice before ending your turn.');if(st.rob)return say('Move the robber first.');
 st.cur=(st.cur+1)%st.n;st.rolled=false;st.kp=false;st.hl=null;st.hist=[];st.col='';st.dice=[1,1];say(PL[st.cur].n+'’s turn. Roll the dice.');render()}
// render
function render(){
 if(st.phase==='play'&&!st.over&&score(st.cur)>=10){st.over=true;say(`🏆 ${PL[st.cur].n} wins with ${score(st.cur)} points!`)}
 let h='';
 hexes.forEach(x=>{const t=st.tiles[x.i],pts=x.v.map(k=>V.get(k).x.toFixed(1)+','+V.get(k).y.toFixed(1)).join(' ');
  const hot=st.hl&&t.n===st.hl&&st.robber!==x.i,sel=st.sel===x.i,mv=st.rob&&st.robber!==x.i,w=hot||sel||mv;
  h+=`<polygon points="${pts}" fill="${RES[t.r].c}" stroke="${w?'#fff':'#5a4630'}" stroke-width="${w?5:2}" ${mv?'stroke-dasharray="6 4"':''} data-h="${x.i}" style="cursor:${mv||st.phase==='config'?'pointer':'default'}"/>`;
  const nm=$('#names').checked;h+=`<text x="${x.x}" y="${x.y-(nm?25:18)}" text-anchor="middle" font-size="18" pointer-events="none">${RES[t.r].e}</text>`+(nm?`<text x="${x.x}" y="${x.y-9}" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1208" stroke="#fffb" stroke-width="2.5" paint-order="stroke" pointer-events="none">${t.r[0].toUpperCase()+t.r.slice(1)}</text>`:'');
  if(t.n)h+=`<circle cx="${x.x}" cy="${x.y+8}" r="14" fill="#f6ecd2" stroke="#5a4630" pointer-events="none"/><text x="${x.x}" y="${x.y+13.5}" text-anchor="middle" font-size="15" font-weight="700" fill="${t.n===6||t.n===8?'#c0261f':'#2a2118'}" pointer-events="none">${t.n}</text>`;
  if(st.robber===x.i)h+=`<ellipse cx="${x.x+20}" cy="${x.y+22}" rx="9" ry="12" fill="#222" stroke="#fff" stroke-width="2" pointer-events="none"/><circle cx="${x.x+20}" cy="${x.y+8}" r="6" fill="#222" stroke="#fff" stroke-width="2" pointer-events="none"/>`});
 hEdges.forEach((e,i)=>{const A=V.get(e.a),B=V.get(e.b),d=Math.hypot(e.mx,e.my),px=e.mx+e.mx/d*30,py=e.my+e.my/d*30,r=RES[st.harbors[i]];
  h+=`<g pointer-events="none"><line x1="${A.x}" y1="${A.y}" x2="${px}" y2="${py}" stroke="#6b4a2a" stroke-width="2"/><line x1="${B.x}" y1="${B.y}" x2="${px}" y2="${py}" stroke="#6b4a2a" stroke-width="2"/><circle cx="${px}" cy="${py}" r="16" fill="#f6ecd2" stroke="#6b4a2a" stroke-width="2"/><text x="${px}" y="${py+(r?-1:4)}" text-anchor="middle" font-size="${r?12:11}" font-weight="700" fill="#2a2118">${r?r.e:'3:1'}</text>${r?`<text x="${px}" y="${py+10}" text-anchor="middle" font-size="9" font-weight="700" fill="#2a2118">2:1</text>`:''}</g>`});
 const live=st.phase!=='config'&&!st.over&&!st.rob&&(st.phase==='setup'||st.rolled),pc=PL[st.cur].c;
 E.forEach(e=>{const A=V.get(e.a),B=V.get(e.b),o=st.roads[e.k],ln=`x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke-linecap="round"`;
  if(o!==undefined)h+=`<line ${ln} stroke="#000a" stroke-width="12" pointer-events="none"/><line ${ln} stroke="${PL[o].c}" stroke-width="7" pointer-events="none"/>`;
  else if(live&&st.tool==='road'&&!canRoad(e.k,st.cur))h+=`<line ${ln} stroke="${pc}" stroke-opacity=".6" stroke-width="8" stroke-dasharray="3 6" pointer-events="none"/>`;
  if(st.phase!=='config'&&st.tool==='road')h+=`<line ${ln} stroke="transparent" stroke-width="20" data-e="${e.k}" style="cursor:pointer"/>`});
 V.forEach(v=>{const b=st.bld[v.k],x=v.x,y=v.y;
  if(b){h+=`<polygon points="${b.t==='city'?`${x-12},${y+8} ${x-12},${y-2} ${x-3},${y-2} ${x-3},${y-8} ${x+3},${y-14} ${x+9},${y-8} ${x+9},${y-2} ${x+12},${y-2} ${x+12},${y+8}`:`${x-9},${y+7} ${x-9},${y-3} ${x},${y-11} ${x+9},${y-3} ${x+9},${y+7}`}" fill="${PL[b.p].c}" stroke="#000" stroke-width="2" stroke-linejoin="round" pointer-events="none"/>`;
   if(live&&st.tool==='city'&&!canCity(v.k,st.cur))h+=`<circle cx="${x}" cy="${y}" r="17" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3 3" pointer-events="none"/>`}
  else if(live&&st.tool==='settlement'&&!canSettle(v.k,st.cur))h+=`<circle cx="${x}" cy="${y}" r="6" fill="${pc}" fill-opacity=".7" stroke="#fff" stroke-width="1.5" pointer-events="none"/>`;
  if(st.phase!=='config'&&['settlement','city'].includes(st.tool))h+=`<circle cx="${x}" cy="${y}" r="14" fill="transparent" data-v="${v.k}" style="cursor:pointer"/>`});
 $('#board').innerHTML=h;side()}
function side(){let h='';
 if(st.phase==='config'){
  h+=`<div class="card"><h2>Number of players</h2><div class="row">${[2,3,4].map(k=>`<button class="${st.n===k?'on':''}" data-n="${k}">${k} players</button>`).join('')}</div></div>`;
  const t=st.tiles[st.sel],c={};st.tiles.forEach(x=>c[x.r]=(c[x.r]||0)+1);
  const ok=Object.keys(STD).every(k=>(c[k]||0)===STD[k]);
  h+=`<div class="card"><h2>Land tiles</h2><div class="row"><button data-act="rec">⭐ Recommended</button><button data-act="rand">🎲 Random</button></div>
  <div class="small">Tap a tile on the board to change its resource or number. The centre tile is always the desert, where the robber starts.</div>`;
  if(t&&st.sel===9)h+=`<div class="small" style="margin-top:8px">The centre tile is fixed as the desert.</div>`;else if(t)h+=`<div class="row" style="margin-top:8px">${Object.keys(RES).filter(r=>r!=='desert').map(r=>`<button class="${t.r===r?'on':''}" data-res="${r}">${RES[r].e}</button>`).join('')}</div>
  ${t.r!=='desert'?`<div class="row">${[2,3,4,5,6,8,9,10,11,12].map(n=>`<button class="${t.n===n?'on':''}" data-num="${n}" style="padding:6px 8px">${n}</button>`).join('')}</div>`:''}`;
  h+=`<div class="small" style="margin-top:6px">${Object.keys(STD).map(k=>RES[k].e+(c[k]||0)).join(' ')} ${ok?'· standard mix ✓':'· standard mix is 4🌲 3🧱 4🐑 4🌾 3⛰️ 1🏜️'}</div></div>
  <button class="big" data-act="start">Start game ➜</button>`}
 else{
  const p=PL[st.cur];
  h+=`<div class="card turn" style="border-color:${p.c}">${st.over?'🏆 '+p.n+' wins!':p.n+'’s turn'}<div class="small" style="font-weight:400">${st.phase==='setup'?`Setup: place your ${st.step==='village'?'village':'road'} (${st.si<st.n?'first':'second'} round)`:st.over?'Game over':st.rob?'Move the robber':st.rolled?'Build, trade, or end your turn':'Roll the dice'}</div></div>`;
  if(st.phase==='play')h+=`<div class="card"><h2>Dice</h2><div class="dice"><span class="die" id="d1">${FACE[st.dice[0]-1]}</span><span class="die" id="d2">${FACE[st.dice[1]-1]}</span><span id="sum">${st.rolled?st.dice[0]+st.dice[1]:'–'}</span></div>
  <div class="row" style="margin-top:8px"><button class="big" data-act="roll" ${st.rolled||st.rob||st.over?'disabled':''}>Roll dice</button></div><div class="small">${st.col}</div></div>`;
  if(st.phase==='play')h+=`<div class="card"><h2>Build</h2><div class="row">${[['road','🛣️ Road'],['settlement','🏠 Village'],['city','🏰 City']].map(([k,l])=>`<button class="${st.tool===k?'on':''}" data-t="${k}">${l}</button>`).join('')}</div>
  <div class="row"><button data-act="knight" ${st.kp||st.rob||st.over?'disabled':''}>⚔️ Play Knight</button><button data-act="undo">↩ Undo build</button></div>
  <button class="big" data-act="end" ${st.rolled&&!st.rob&&!st.over?'':'disabled'}>Done – next player ➜</button>
  <div class="small" style="margin-top:6px">Costs: Road 🌲🧱 · Village 🌲🧱🐑🌾 · City 🌾🌾⛰️⛰️⛰️ · Dev card 🐑🌾⛰️</div></div>`;
  else h+=`<div class="card"><div class="row"><button data-act="undo">↩ Undo village</button></div><div class="small">Snake order: 1→${st.n}, then ${st.n}→1. Your second village earns cards from its neighbouring tiles.</div></div>`;
  h+=`<div class="card"><h2>Scores (first to 10)</h2>${PL.slice(0,st.n).map((q,i)=>`<div class="pl ${st.cur===i?'cur':''}"><span class="dot" style="background:${q.c}"></span><div><b>${q.n}</b><div class="small">⚔️ Knights played: ${st.kn[i]||0} · Longest road: ${(st.len[i]||0)}</div><div class="small">${st.lr===i?'🛣️ Longest Road (+2) ':''}${st.la===i?'⚔️ Largest Army (+2)':''}</div></div><span class="vp">${score(i)}</span></div>`).join('')}</div>`}
 $('#side').innerHTML=h}
// events
$('#board').addEventListener('click',e=>{const d=e.target.dataset;if(d.v)act('v',d.v);else if(d.e)act('e',d.e);else if(d.h!==undefined)act('h',d.h)});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.n){st.n=+d.n;render()}
 else if(d.res){const t=st.tiles[st.sel];t.r=d.res;t.n=t.n||5;render()}
 else if(d.num){st.tiles[st.sel].n=+d.num;render()}
 else if(d.t){st.tool=d.t;say({road:'Tap a dotted edge to build a road.',settlement:'Tap a highlighted corner to build a village.',city:'Tap one of your villages to upgrade it.'}[d.t]);render()}
 else if(d.act==='rec'){recommended();say('Recommended layout loaded: desert and robber in the middle.');render()}
 else if(d.act==='rand'){randomTiles();say('Random layout loaded.');render()}
 else if(d.act==='start')start();else if(d.act==='roll')roll();else if(d.act==='knight')knight();
 else if(d.act==='undo')undo();else if(d.act==='end')endTurn();
 else if(d.act==='newgame'&&confirm('Start a new game? The current board and pieces will be cleared.'))newGame()});
$('#names').addEventListener('change',render);
newGame();
</script>
</body>
</html>
