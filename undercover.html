*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.45 "Trebuchet MS","Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;overflow-anchor:none}
header{background:var(--teal);color:#fff;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{margin:0;font-size:24px}
#score{font-size:16px;display:flex;gap:12px;flex-wrap:wrap}
#score span{background:rgba(255,255,255,.18);padding:2px 10px;border-radius:12px}
main{max-width:1180px;margin:0 auto;padding:14px 16px 36px;overflow-anchor:none}
h2{margin:4px 0 6px}
button{font:inherit;padding:13px 22px;min-height:46px;border:0;border-radius:12px;background:var(--teal);color:#fff;margin:0 8px 0 0;cursor:pointer;touch-action:manipulation}
button.alt{background:#fff;color:var(--teal);border:2px solid var(--teal)}
button.sun{background:var(--sun);color:var(--ink)}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.card{background:var(--card);border:3px dashed var(--teal);border-radius:20px;min-height:210px;display:flex;align-items:center;justify-content:center;font-size:40px;text-align:center;margin:12px 0;padding:16px;cursor:pointer}
.card.up{border-style:solid;background:#e8f4f2}
.err{color:var(--bad);font-weight:bold}
.grid{display:flex;flex-wrap:wrap;gap:8px}

/* Fixed-height status & action slot so board content never shifts vertically */
.status-slot{min-height:44px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin:2px 0 4px}
.status-slot h2{margin:0;font-size:26px;line-height:1.2}
.status-hint{font-size:14px;color:var(--teal);min-height:20px}
.status-hint.warn{color:var(--bad);font-weight:bold}
.action-slot{min-height:56px;display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:4px 0 8px}

/* Lobby setup */
.human-setup{background:#fffdf7;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}
.human-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.human-top label{font-weight:bold}
.picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.pick-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px;margin:0;min-height:76px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--ink);font-size:12px;font-weight:bold}
.pick-btn.selected{border-color:var(--teal);background:#dff3ef;box-shadow:0 0 0 2px var(--teal)}
.pick-btn img{width:52px;height:52px;object-fit:cover;object-position:top center;border-radius:8px;display:block}
.mode-choice{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 14px}
.mode-btn{min-height:46px;padding:10px 16px;border-radius:12px;border:2px solid var(--teal);background:#fff;color:var(--teal);font-weight:bold;margin:0}
.mode-btn.active{background:var(--teal);color:#fff}

.board-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0 16px;overflow-anchor:none}
.board-grid{display:grid;gap:8px;min-width:660px;align-items:start;overflow-anchor:none}
.char-header-cell{background:var(--bg);padding:8px 4px 12px;border-bottom:2px solid var(--line);display:flex;flex-direction:column;align-items:center;text-align:center;border-radius:14px;min-height:172px;justify-content:flex-start;transition:background .15s,box-shadow .15s}
.char-header-cell.active{background:#fff1bd;box-shadow:0 0 0 2.5px var(--teal)}
.char-header-cell.out{opacity:.45;filter:grayscale(.75)}
.char-badge{font-size:11px;font-weight:bold;background:var(--teal);color:#fff;border-radius:999px;padding:2px 9px;margin-bottom:4px}
.char-frame{width:82px;height:92px;border-radius:14px;overflow:hidden;border:2px solid var(--ink);background:#fff;display:block;flex-shrink:0}
.char-img{width:82px;height:92px;max-width:none;object-fit:cover;object-position:top center;display:block}
.char-name{font-size:15px;font-weight:bold;margin-top:6px;line-height:1.2;min-height:18px}
.char-meta{font-size:11px;color:#526664;line-height:1.2;min-height:14px}

.row-label{font-size:12px;font-weight:bold;color:#415654;padding:6px 2px;border-top:1px dashed var(--line);display:flex;align-items:center;gap:6px;min-height:86px}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot-clue{background:var(--clue-bd)}
.dot-vote{background:var(--vote-bd)}

.slot-cell{padding:4px 2px;border-top:1px dashed var(--line);min-height:86px}
.slot-cell.out{opacity:.45}
.bubble{border-radius:12px;padding:8px 10px;font-size:13.5px;line-height:1.36;word-break:break-word;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.bubble.clue{background:var(--clue-bg);border:1.5px solid var(--clue-bd);color:#153633}
.bubble.vote{background:var(--vote-bg);border:1.5px solid var(--vote-bd);color:#472c08}
.bubble.draft{background:var(--draft-bg);border:2px dashed var(--draft-bd);color:var(--ink)}
.bubble.empty{background:transparent;border:1px dashed #d8cab0;color:#9b9486;font-size:12px;text-align:center;padding:8px 4px;box-shadow:none;min-height:68px;display:flex;align-items:center;justify-content:center}
.bubble-tag{font-size:10px;font-weight:bold;text-transform:uppercase;letter-spacing:.03em;opacity:.72;margin-bottom:3px}
.bubble-body{display:inline}
.draft-input{width:100%;font-family:inherit;font-size:14px;line-height:1.35;padding:7px 8px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);resize:vertical;min-height:56px;user-select:text;-webkit-user-select:text}
.draft-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mic-toggle-btn{padding:8px 12px;min-height:42px;font-size:13px;font-weight:bold;border-radius:9px;margin:0;background:var(--sun);color:var(--ink);border:1.5px solid var(--ink)}
.mic-toggle-btn.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.draft-confirm{padding:8px 14px;min-height:42px;font-size:13px;font-weight:bold;border-radius:9px;margin:0;background:var(--teal);color:#fff}
.amp-btn{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;width:28px;height:28px;min-height:28px;padding:0;margin:0 0 0 6px;border-radius:999px;font-size:13px;line-height:1;background:rgba(31,111,107,.14);color:var(--ink);border:1px solid rgba(31,111,107,.35)}
.bubble.vote .amp-btn{background:rgba(180,115,20,.16);border-color:rgba(180,115,20,.4)}
.amp-btn:hover{background:var(--sun);color:var(--ink)}

/* Tablet & touch layout adjustments */
@media (max-width: 1024px) {
  body{font-size:18px}
  main{padding:12px 12px 32px}
  .status-slot h2{font-size:22px}
  .char-frame{width:88px;height:98px}
  .char-img{width:88px;height:98px}
  .char-name{font-size:14px}
  .draft-input{font-size:15px;min-height:64px}
  .mic-toggle-btn,.draft-confirm{min-height:44px;padding:9px 14px;font-size:14px}
}
</style>

function guessGender(name) {
  const n = (name || "").trim().toLowerCase();
  if (["mia","zoe","amy","eva","lily","lucy","anna","ella","emma","sophia","chloe","grace","olivia","ruby","claire","alice","rose","nina","tina","wendy","hannah","clara"].includes(n)) return "female";

  if (/[aei]$/.test(n) && !["mike","luke","kyle","nate","blake","charlie","jamie"].includes(n)) return "female";
  return "male";
}

function normalizeGender(av, name) {
  if (av && (av.gender === "female" || av.gender === "male")) return av.gender;
  if (av && typeof av.avatarId === "string") {
    if (av.avatarId.startsWith("f")) return "female";
    if (av.avatarId.startsWith("m")) return "male";
  }
  if (av && typeof av.id === "string") {
    if (av.id.startsWith("f")) return "female";
    if (av.id.startsWith("m")) return "male";
  }
  return guessGender(name);
}

function voiceForGender(gender, seedStr, preferredVoice) {
  const g = gender === "female" ? "female" : "male";
  const pool = g === "female" ? FEMALE_VOICES : MALE_VOICES;
  if (preferredVoice && pool.includes(preferredVoice)) return preferredVoice;
  let h = 0;
  const s = seedStr || "";
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return pool[h % pool.length];
}

function containsForbiddenWord(text, forbiddenList) {
  const normText = " " + (text || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim() + " ";
  const compactText = (text || "").toLowerCase().replace(/[^a-z0-9]+/g, "");
  if (!normText.trim()) return false;
  for (const w of (forbiddenList || [])) {
    const base = (w || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
    if (!base) continue;
    const compact = base.replace(/\s+/g, "");
    const variants = new Set([base, compact]);
    for (const term of [...variants]) {
      if (term.length >= 3) {
        variants.add(term + "s");
        variants.add(term + "es");
        variants.add(term + "ed");
        variants.add(term + "ing");
        variants.add(term + "er");
        variants.add(term + "ers");
      }
    }
    for (const part of base.split(/\s+/)) {
      if (part.length >= 4) {
        variants.add(part);
        variants.add(part + "s");
        variants.add(part + "ing");
        variants.add(part + "ed");
      }
    }
    for (const v of variants) {
      if (v && (normText.includes(" " + v + " ") || (v.length >= 4 && compactText.includes(v)))) {
        return true;
      }
    }
  }
  return false;
}

function buildRows() {
  if (!S || !S.hist || !S.hist.length) return [];
  const rows = [];
  let clueRow = null;

  S.hist.forEach((item, idx) => {
    const entry = { text: item.text, histIdx: idx };
    if (item.kind === 'clue') {
      if (!clueRow || clueRow.round !== item.round || item.name in clueRow.cells) {
        clueRow = { id: 'clue-' + item.round + '-' + rows.length, label: 'Round ' + item.round + ' Clues', type: 'clue', cells: {}, round: item.round };
        rows.push(clueRow);
      }
      clueRow.cells[item.name] = entry;
    } else if (item.kind === 'defend') {
      clueRow = null;
      rows.push({
        id: 'defend-' + item.round + '-' + rows.length,
        label: 'Round ' + item.round + ' Defence',
        type: 'clue',
        cells: { [item.name]: entry }
      });
    } else if (item.kind === 'vote') {
      clueRow = null;
      const lastVote = rows.length ? rows[rows.length - 1] : null;
      if (lastVote && lastVote.type === 'vote' && lastVote.round === item.round && !(item.name in lastVote.cells)) {
        lastVote.cells[item.name] = entry;
      } else {
        rows.push({
          id: 'vote-' + item.round + '-' + rows.length,
          label: 'Round ' + item.round + ' Vote',
          type: 'vote',
          round: item.round,
          cells: { [item.name]: entry }
        });
      }
    }
  });
  return rows;
}

      html += '<div class="row-label">Round 1 Clues</div>';
      S.players.forEach(p => {

    for (const r of rows) {
      const rKind = r.type === 'vote' ? 'vote' : (r.id.startsWith('defend-') ? 'defend' : 'clue');
      const rRound = r.round || 1;
      const dotClass = r.type === 'vote' ? 'dot-vote' : 'dot-clue';
      html += '<div class="row-label"><span class="legend-dot ' + dotClass + '"></span><span>' + esc(r.label) + '</span></div>';
      for (const p of S.players) {

      html += '<div class="row-label"><span class="legend-dot ' + dotClass + '"></span><span>' + esc(draftRowLabel) + '</span></div>';
      for (const p of S.players) {
        html += renderBubbleOrDraft(p, null, draftRowType, draft.round);
      }
    }
  }

  html += '</div></div>';
  return html;
}

// ---------- audio: strict gender-matched voices, instant playback, clean fallback ----------
let activeAudio = null;
let speechSeq = 0;

function stopAudio() {
  speechSeq++;
  if (activeAudio) {
    try { activeAudio.pause(); activeAudio.currentTime = 0; } catch (e) {}
    activeAudio = null;
  }
  if ('speechSynthesis' in window) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }
}

function playAudioBase64(b64, seq) {
  return new Promise((resolve, reject) => {
    if (seq !== speechSeq) return resolve();
    const au = new Audio('data:audio/mp3;base64,' + b64);
    activeAudio = au;
    au.onended = () => { if (activeAudio === au) activeAudio = null; resolve(); };
    au.onerror = () => { if (activeAudio === au) activeAudio = null; reject(new Error('Audio playback failed')); };
    au.play().then(resolve).catch(err => {
      if (activeAudio === au) activeAudio = null;
      reject(err);
    });
  });
}

function speakBrowserFallback(text, gender, seq) {
  if (!('speechSynthesis' in window) || seq !== speechSeq) return false;
  try {
    window.speechSynthesis.cancel();
    const g = gender === 'female' ? 'female' : 'male';
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = Math.max(0.75, Math.min(1.25, +cfg.speech_rate || 0.92));
    u.pitch = g === 'female' ? 1.15 : 0.85;
    const voices = window.speechSynthesis.getVoices() || [];
    const enVoices = voices.filter(v => /en/i.test(v.lang));
    const femaleRx = /female|woman|girl|zira|samantha|victoria|aria|jenny|ava|allison|claire|zoe|hazel|susan|karen|moira|tessa|fiona/i;
    const maleRx = /male|man|boy|david|mark|alex|daniel|guy|ryan|arthur|george|liam|noah|james|thomas|fred|oliver/i;
    const matched = g === 'female'
      ? (enVoices.find(v => femaleRx.test(v.name)) || enVoices.find(v => !maleRx.test(v.name)) || enVoices[0])
      : (enVoices.find(v => maleRx.test(v.name)) || enVoices.find(v => !femaleRx.test(v.name)) || enVoices[0]);
    if (matched) u.voice = matched;
    window.speechSynthesis.speak(u);
    return true;
  } catch (e) {
    return false;
  }
}

async function speak(e, opts = {}) {
  stopAudio();
  const seq = speechSeq;
  const g = normalizeGender(e, e.name);
  const genderPool = g === 'female' ? FEMALE_VOICES : MALE_VOICES;
  const primaryVoice = voiceForGender(g, e.name, e.voice);
  const candidates = [primaryVoice, ...genderPool.filter(v => v !== primaryVoice)];

  if (!e.audio) {
    let fetched = false;
    for (const v of candidates) {
      if (seq !== speechSeq) return;
      try {
        const res = await post('/tts', { text: e.text, voice: v, rate: +cfg.speech_rate, gender: g });
        if (seq !== speechSeq) return;
        if (res && res.audio_base64) {
          e.audio = res.audio_base64;
          e.gender = g;
          e.voice = genderPool.includes(res.voice) ? res.voice : v;
          fetched = true;
          break;
        }
      } catch (err) {
        // Try next gender-matched voice or browser fallback
      }
    }
    if (!fetched) {
      if (seq !== speechSeq) return;
      const ok = speakBrowserFallback(e.text, g, seq);
      if (!ok && opts.force) $('tts').textContent = 'Audio unavailable on this device.';
      return;
    }
  }

  if (seq !== speechSeq) return;
  try {
    await playAudioBase64(e.audio, seq);
  } catch (err) {
    if (seq === speechSeq) speakBrowserFallback(e.text, g, seq);
  }
}

let rec, chunks, stream;
async function startRec() {
  stream = stream || await navigator.mediaDevices.getUserMedia({ audio: true });
  chunks = [];
  rec = new MediaRecorder(stream);
  rec.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
  rec.start(250);
}
const stopRec = () => new Promise(r => { rec.onstop = () => r(new Blob(chunks)); rec.stop(); });
async function wavB64(blob) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const buf = await ctx.decodeAudioData(await blob.arrayBuffer());
  const oc = new OfflineAudioContext(1, Math.max(1, Math.ceil(buf.duration * 16000)), 16000);
  const src = oc.createBufferSource(); src.buffer = buf; src.connect(oc.destination); src.start();
  const d = (await oc.startRendering()).getChannelData(0), n = d.length;
  const v = new DataView(new ArrayBuffer(44 + n * 2)), w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 16000, true); v.setUint32(28, 32000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) { const s = Math.max(-1, Math.min(1, d[i])); v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
  const u = new Uint8Array(v.buffer); let b = '';
  for (let i = 0; i < u.length; i += 8192) b += String.fromCharCode.apply(null, u.subarray(i, i + 8192));
  return btoa(b);
}

// ---------- human speech: easy Tap Speak / Tap Stop toggle in player's bubble ----------
function humanSpeak(title, phaseLabel, playerObj, round, kind, topActionHtml) {
  stopAudio();
  activeDraft = { playerName: playerObj.name, round, kind, text: '', recording: false };

  return new Promise(res => {
    let busy = false;

    function setHint(msg, warn = false) {
      const el = $('liveHint');
      if (!el) return;
      el.textContent = msg;
      el.classList.toggle('warn', Boolean(warn));
    }

    function syncMicUi() {
      const btn = $('micToggleBtn');
      if (!btn) return;
      const on = Boolean(activeDraft && activeDraft.recording);
      btn.classList.toggle('on', on);
      btn.textContent = on ? '⏹ Stop' : '🎤 Tap Speak';
    }

    function wireControls() {
      const mic = $('micToggleBtn');
      const box = $('draftBox');
      const ok = $('draftConfirm');

      if (box) {
        box.oninput = () => {
          if (activeDraft) activeDraft.text = box.value;
        };
      }

      if (mic) {
        mic.onclick = async e => {
          e.preventDefault();
          e.stopPropagation();
          if (busy) return;
          busy = true;
          try {
            if (!activeDraft.recording) {
              await startRec();
              activeDraft.recording = true;
              syncMicUi();
              setHint('Recording... tap Stop when finished.');
            } else {
              activeDraft.recording = false;
              syncMicUi();
              setHint('Recognising...');
              const blob = await stopRec();
              if (!blob.size) {
                setHint('No audio captured. Tap Speak and talk clearly, or type.', true);
              } else {
                const r = await post('/asr', { audio_base64: await wavB64(blob) });
                const heard = (r.text || '').trim();
                if (heard) {
                  activeDraft.text = heard;
                  const curBox = $('draftBox');
                  if (curBox) curBox.value = heard;
                  if (containsForbiddenWord(heard, [playerObj.word])) {
                    setHint('Do not say your secret word! Edit before confirming.', true);
                  } else {
                    setHint('Check your text in the bubble, then tap Confirm.');
                  }
                } else {
                  setHint('Nothing heard. Tap Speak again or type.', true);
                }
              }
            }
          } catch (err) {
            if (activeDraft) activeDraft.recording = false;
            syncMicUi();
            setHint('Mic error: ' + err.message + '. You can type in the bubble.', true);
          } finally {
            busy = false;
          }
        };
      }

      if (ok) {
        ok.onclick = async () => {
          if (activeDraft && activeDraft.recording && rec && rec.state === 'recording') {
            try { await stopRec(); } catch (e) {}
            activeDraft.recording = false;
          }
          const curBox = $('draftBox');
          const t = (curBox ? curBox.value : (activeDraft ? activeDraft.text : '')).trim();
          if (!t) {
            setHint('Tap Speak or type your statement first.', true);
            return;
          }
          if (containsForbiddenWord(t, [playerObj.word])) {
            setHint('You cannot say your secret word!', true);
            return;
          }
          activeDraft = null;
          res(t);
        };
      }
    }

    view(boardScreen(title, topActionHtml || '', playerObj.name, phaseLabel, 'Tap Speak to record (tap Stop to finish), or type in your bubble.'));
    wireControls();
  });
}

async function rest(table, query) {
  const r = await fetch('https://' + CFG.ENV + '.api.tcloudbasegateway.com/v1/rdb/rest/' + table + '?' + query, { headers: { Authorization: 'Bearer ' + CFG.KEY } });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && (j.message || j.error)) || 'Database error ' + r.status);
  return j;
}
async function loadAll() {
  cfg = (await rest('settings', 'select=*&id=eq.1'))[0];

}

async function fetchAIWordPair() {
  const existing = pairs.flatMap(w => [w.word_a, w.word_b]).slice(0, 80);
  const funnyTwist = Math.random() < 0.22;
  const r = await post('/ai/words', {
    count: 1,
    theme: funnyTwist ? 'everyday life (funny contrasting pair)' : 'everyday life',
    difficulty: cfg.difficulty,
    grade: cfg.difficulty,
    funny_twist: funnyTwist,
    existing
  });
  const list = Array.isArray(r.pairs) ? r.pairs : [];
  if (list.length && list[0].a && list[0].b) {
    return { word_a: String(list[0].a).trim().toLowerCase(), word_b: String(list[0].b).trim().toLowerCase() };
  }
  throw new Error('AI did not return a valid word pair.');
}

function lobby() {
  stopAudio();
  activeDraft = null;
  return new Promise(async resolve => {
    await loadAll();
    const hCount = Math.max(0, +cfg.human_count || 0);
    const aCount = Math.max(0, +cfg.ai_count || 0);
    const total = hCount + aCount;
    if (total < 3 || total > 8 || cfg.undercover_count > Math.floor((total - 1) / 2) || !pairs.length) {
      view('<h2>Not ready</h2><p class="err">Ask your teacher to check the settings and word list in the admin page.</p><button id="retry">Try again</button>');
      $('retry').onclick = () => resolve({ action: 'retry' });
      return;
    }

    let wordSource = 'db';
    const picked = Array.from({ length: hCount }, (_, idx) => AVATAR_POOL[idx % AVATAR_POOL.length].id);
    const seenInit = new Set();
    for (let i = 0; i < picked.length; i++) {
      if (seenInit.has(picked[i])) {
        const alt = AVATAR_POOL.find(a => !seenInit.has(a.id));
        if (alt) picked[i] = alt.id;
      }
      seenInit.add(picked[i]);
    }

    function renderLobby(errMsg) {
      let blocks = '';
      for (let i = 0; i < hCount; i++) {
        const currentPick = picked[i];
        const takenByOthers = new Set(picked.filter((id, idx) => idx !== i));
        const gridHtml = AVATAR_POOL.map(av => {
          const isSel = currentPick === av.id;

            '<img src="' + esc(av.img) + '" alt="' + esc(av.label) + '" onerror="this.onerror=null;this.src=\'' + fb + '\'">' +
            '<span>' + esc(av.label) + '</span>' +

        }).join('');

        blocks += '<div class="human-setup">' +
          '<div class="human-top"><label>Human ' + (i + 1) + ' Name:</label>' +
          '<input class="nm" data-hname="' + i + '" value="Player ' + (i + 1) + '" maxlength="12" style="font:inherit;padding:8px 12px;border:2px solid var(--line);border-radius:8px"></div>' +
          '<div style="font-size:13px;color:#4f6361;margin-bottom:6px">Choose portrait:</div>' +
          '<div class="picker-grid">' + gridHtml + '</div>' +
          '</div>';
      }

      view('<h2>New game</h2>' +
        '<p>' + hCount + ' human and ' + aCount + ' AI players, ' + cfg.undercover_count + ' undercover · Level: <b>' + esc(cfg.difficulty || 'normal') + '</b>.</p>' +
        '<div style="font-size:14px;font-weight:bold;margin-top:6px">Word pair source:</div>' +
        '<div class="mode-choice">' +
          '<button type="button" class="mode-btn' + (wordSource === 'db' ? ' active' : '') + '" data-wsrc="db">From Word Bank</button>' +
          '<button type="button" class="mode-btn' + (wordSource === 'ai' ? ' active' : '') + '" data-wsrc="ai">AI Secret Pair (Teacher-Hidden)</button>' +
        '</div>' +
        (errMsg ? '<p class="err">' + esc(errMsg) + '</p>' : '') +
        blocks +
        '<button id="goBtn">Start</button><button type="button" class="alt" id="resetBtn">Reset scores</button>');

      $('main').querySelectorAll('[data-wsrc]').forEach(b => {
        b.onclick = () => {
          const savedNames = [...document.querySelectorAll('.nm')].map(inp => inp.value);
          wordSource = b.dataset.wsrc;
          renderLobby('');
          [...document.querySelectorAll('.nm')].forEach((inp, idx) => {
            if (savedNames[idx] !== undefined) inp.value = savedNames[idx];
          });
        };
      });

      $('main').querySelectorAll('.pick-btn').forEach(btn => {
        btn.onclick = () => {
          const hIdx = +btn.dataset.h;
          const avId = btn.dataset.av;
          if (picked.some((id, idx) => idx !== hIdx && id === avId)) return;
          const savedNames = [...document.querySelectorAll('.nm')].map(inp => inp.value);
          picked[hIdx] = avId;
          renderLobby('');
          [...document.querySelectorAll('.nm')].forEach((inp, idx) => {
            if (savedNames[idx] !== undefined) inp.value = savedNames[idx];
          });
        };
      });

      $('resetBtn').onclick = () => {
        scores = {};
        try { localStorage.removeItem('uc_scores'); } catch (e) {}
        drawScores();
        renderLobby('');
      };

      $('goBtn').onclick = () => {
        const hs = [...document.querySelectorAll('.nm')].map((inp, k) => inp.value.trim() || 'Player ' + (k + 1));
        if (new Set(hs.map(x => x.toLowerCase())).size < hs.length) {
          renderLobby('Human player names must be unique.');
          return;
        }
        resolve({ action: 'start', humanNames: hs, humanAvatarIds: picked, wordSource });
      };
    }

    renderLobby('');
  });
}

async function play(humanNames, humanAvatarIds, wordSource) {
  let pr;
  if (wordSource === 'ai') {
    view('<h2>Generating secret word pair...</h2><p>Creating a level-appropriate pair for this round.</p>');
    pr = await fetchAIWordPair();
  } else {
    let fresh = pairs.filter(p => !used.has(p.id)); if (!fresh.length) { used.clear(); fresh = pairs; }
    pr = fresh[Math.floor(Math.random() * fresh.length)]; used.add(pr.id);
  }

  const flip = Math.random() < .5, cWord = flip ? pr.word_b : pr.word_a, uWord = flip ? pr.word_a : pr.word_b;

  const usedAvatarIds = new Set();
  const usedNamesLower = new Set(humanNames.map(n => n.trim().toLowerCase()));

  const humanObjs = humanNames.map((n, idx) => {
    const chosenId = humanAvatarIds && humanAvatarIds[idx];
    const av = AVATAR_POOL.find(a => a.id === chosenId && !usedAvatarIds.has(a.id))
      || AVATAR_POOL.find(a => !usedAvatarIds.has(a.id))
      || AVATAR_POOL[idx % AVATAR_POOL.length];
    usedAvatarIds.add(av.id);
    const gender = normalizeGender(av, n);
    return {
      name: n,
      ai: false,
      avatarId: av.id,
      label: av.label,
      gender,
      voice: voiceForGender(gender, av.id + ':' + n, av.voice),
      img: av.img
    };
  });

  // Pick AI avatars that are neither used by humans nor sharing a human player's name
  const unusedAvatars = shuffle(AVATAR_POOL.filter(a => !usedAvatarIds.has(a.id)));
  const cleanNameAvatars = unusedAvatars.filter(a => !usedNamesLower.has(a.defaultName.toLowerCase()));
  const fallbackAvatars = unusedAvatars.filter(a => usedNamesLower.has(a.defaultName.toLowerCase()));
  const orderedAiAvatars = [...cleanNameAvatars, ...fallbackAvatars];

  const aiObjs = [];
  for (let i = 0; i < (cfg.ai_count || 0); i++) {
    const av = orderedAiAvatars[i] || AVATAR_POOL.find(a => !usedAvatarIds.has(a.id)) || AVATAR_POOL[i % AVATAR_POOL.length];
    usedAvatarIds.add(av.id);
    const gender = normalizeGender(av, av.defaultName);

    let aiName = av.defaultName;
    if (usedNamesLower.has(aiName.toLowerCase())) {
      const genderBackupPool = gender === "female" ? EXTRA_FEMALE_NAMES : EXTRA_MALE_NAMES;
      const altName = genderBackupPool.find(nm => !usedNamesLower.has(nm.toLowerCase()))
        || [...EXTRA_MALE_NAMES, ...EXTRA_FEMALE_NAMES].find(nm => !usedNamesLower.has(nm.toLowerCase()))
        || ("Guest " + (i + 1));
      aiName = altName;
    }
    usedNamesLower.add(aiName.toLowerCase());

    aiObjs.push({
      name: aiName,
      ai: true,
      avatarId: av.id,
      label: av.label,
      gender,
      voice: voiceForGender(gender, av.id + ':' + aiName, av.voice),
      img: av.img
    });
  }

  const ps = shuffle([...humanObjs, ...aiObjs]);
  const us = new Set(shuffle(ps.map((_, i) => i)).slice(0, cfg.undercover_count));
  ps.forEach((p, i) => { p.under = us.has(i); p.word = p.under ? uWord : cWord; p.alive = true; if (!(p.name in scores)) scores[p.name] = 0; });
  S = { players: ps, hist: [], cWord, uWord, wordSource };
  drawScores();

  for (const p of ps.filter(p => !p.ai)) {
    await wait('<h2>' + esc(p.name) + ', this card is for you</h2><p>Nobody else should look.</p><button data-go="y">I am ' + esc(p.name) + '</button>');
    view('<h2>' + esc(p.name) + '</h2><div class="card" id="card">Tap to see your word</div><button data-go="h">Hide the card</button>');
    $('card').onclick = () => { $('card').textContent = p.word; $('card').classList.add('up'); };
    await new Promise(r => $('main').querySelector('[data-go]').onclick = r);
  }

  for (let round = 1; ; round++) {
    for (const p of alive()) await turn(p, round, 'clue');
    let cands = alive(), res = await vote(cands, round);
    if (res.tie) {
      for (const p of res.tie) await turn(p, round, 'defend');
      res = await vote(res.tie, round, true);
    }
    if (res.out) {
      res.out.alive = false;
      await wait(boardScreen(
        res.out.name + ' is out!',
        '<button data-go="n">Continue</button><span style="font-size:15px">Word: <b>' + esc(res.out.word) + '</b> (' + (res.out.under ? 'UNDERCOVER' : 'civilian') + ')</span>',
        res.out.name,
        'Round ' + round + ' · Eliminated'
      ));
    } else await wait(boardScreen(
      'Tie again',
      '<button data-go="n">Continue</button><span style="font-size:15px">Nobody goes out this round.</span>',
      null,
      'Round ' + round + ' · Tie'
    ));
    const u = alive().filter(p => p.under).length, c = alive().length - u;
    if (u === 0) return finish('civilians');
    if (c <= u) return finish('undercovers');
  }
}

async function turn(p, round, kind) {
  const phase = kind === 'defend' ? ('Round ' + round + ' · Defence') : ('Round ' + round + ' · Clue');
  if (p.ai) {
    view(boardScreen(p.name + ' is thinking...', '', p.name, phase));
    let text = (await post('/ai/speak', {
      name: p.name,
      word: p.word,
      level: cfg.difficulty,
      grade: cfg.difficulty,
      players: S.players.length,
      undercovers: cfg.undercover_count,
      history: hist4ai(),
      mode: kind === 'defend' ? 'defend' : 'speak'
    })).content;
    if (containsForbiddenWord(text, [p.word])) {
      text = 'I have a clear idea of how this fits into everyday life.';
    }
    const e = { round, name: p.name, text, ai: true, avatarId: p.avatarId, voice: p.voice, gender: p.gender, kind };
    S.hist.push(e);
    const waitPromise = wait(boardScreen(p.name + ' says:', '<button data-go="n">Next</button>', p.name, phase));
    speak(e);
    await waitPromise;
  } else {
    const text = await humanSpeak((kind === 'defend' ? 'Defend yourself, ' : 'Your turn, ') + p.name, phase, p, round, kind);
    const e = { round, name: p.name, text, ai: false, avatarId: p.avatarId, voice: p.voice, gender: p.gender, kind };
    S.hist.push(e);
  }
}

function pickSuspect(voter, opts, phase) {
  return new Promise(resolve => {
    const voteButtons = '<div class="grid">' +
      opts.map(o => '<button type="button" data-pick="' + esc(o.name) + '">' + esc(o.name) + '</button>').join('') +
      '</div>';
    view(boardScreen(voter.name + ', who do you suspect?', voteButtons, voter.name, phase, 'Tap a player, then explain why you suspect them.'));
    $('main').querySelectorAll('[data-pick]').forEach(btn => {
      btn.onclick = () => {
        stopAudio();
        resolve(btn.dataset.pick);
      };
    });
  });
}

async function vote(cands, round, second) {
  const tally = {};
  const phase = (second ? 'Round ' + round + ' · Second Vote' : 'Round ' + round + ' · Voting');
  cands.forEach(c => tally[c.name] = 0);
  for (const v of alive()) {
    const opts = cands.filter(c => c !== v); if (!opts.length) continue;
    let target;
    if (v.ai) {
      view(boardScreen(v.name + ' is voting...', '', v.name, phase));
      const r = await post('/ai/vote', {
        name: v.name,
        word: v.word,
        pair_words: [S.cWord, S.uWord],
        level: cfg.difficulty,
        grade: cfg.difficulty,
        history: hist4ai(),
        candidates: opts.map(o => ({ name: o.name, ai: o.ai }))
      });
      const validNames = opts.map(o => o.name);
      target = validNames.includes(r.target) ? r.target : opts[Math.floor(Math.random() * opts.length)].name;
      if (!v.under && LOW_GRADES.has(String(cfg.difficulty || '').toUpperCase())) {
        const pickedObj = opts.find(o => o.name === target);
        const aiAlts = opts.filter(o => o.name !== target && o.ai);
        if (pickedObj && !pickedObj.ai && aiAlts.length && Math.random() < 0.55) {
          target = aiAlts[Math.floor(Math.random() * aiAlts.length)].name;
        }
      }
      let reason = r.reason || '';
      if (containsForbiddenWord(reason, [v.word, S.cWord, S.uWord])) {
        reason = target + "'s clue seemed the least consistent with the group.";
      }
      const e = { round, name: v.name, text: 'I vote for ' + target + '. ' + reason, ai: true, avatarId: v.avatarId, voice: v.voice, gender: v.gender, kind: 'vote' };
      S.hist.push(e);
      const waitPromise = wait(boardScreen(v.name + ' votes', '<button data-go="n">Next</button>', v.name, phase));
      speak(e);
      await waitPromise;
    } else {
      target = await pickSuspect(v, opts, phase);
      const reason = await humanSpeak(
        v.name + ' votes for ' + target,
        phase,
        v,
        round,
        'vote',
        '<span style="font-size:15px">Suspect: <b>' + esc(target) + '</b></span>'
      );
      const e = { round, name: v.name, text: 'I vote for ' + target + '. ' + reason, ai: false, avatarId: v.avatarId, voice: v.voice, gender: v.gender, kind: 'vote' };
      S.hist.push(e);
    }
    tally[target]++;
  }
  const max = Math.max(...Object.values(tally)), top = cands.filter(c => tally[c.name] === max);
  const tallyText = cands.map(c => esc(c.name) + ': ' + tally[c.name]).join(' · ');
  await wait(boardScreen(
    second ? 'Second vote' : 'Votes',
    '<button data-go="n">Continue</button><span style="font-size:15px">' + tallyText + '</span>',
    null,
    phase
  ));
  if (top.length === 1) return { out: top[0] };
  return second ? { out: null } : { tie: top };
}

async function finish(winner) {
  const pts = [];
  S.players.forEach(p => { const win = winner === 'civilians' ? !p.under : p.under; if (win) { const n = p.under ? 4 : 2; addScore(p.name, n); pts.push(esc(p.name) + ' +' + n); } });
  const summary = 'Civilian: <b>' + esc(S.cWord) + '</b> · Undercover: <b>' + esc(S.uWord) +
    '</b> · Spy: ' + S.players.filter(p => p.under).map(p => esc(p.name)).join(', ') +
    (pts.length ? ' · Points: ' + pts.join(', ') : '');
  await wait(boardScreen(
    winner === 'civilians' ? 'Civilians win!' : 'Undercovers win!',
    '<button data-go="n">Next game</button><span style="font-size:14px">' + summary + '</span>',
    null,
    'Game Over'
  ));
  start();
}

async function start() {
  try {
    const res = await lobby();
    if (res.action === 'retry') return start();
    await play(res.humanNames, res.humanAvatarIds, res.wordSource);
  }
  catch (e) { await wait('<h2>Something went wrong</h2><p class="err">' + esc(e.message || String(e)) + '</p><button data-go="r">Start again</button>'); start(); }
}
drawScores();
start();
</script>
