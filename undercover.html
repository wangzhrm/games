<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Undercover</title>
<style>
:root{--bg:#fff7e6;--ink:#1d2b2a;--teal:#1f6f6b;--sun:#f0b429;--card:#fff;--line:#e6d9bb;--bad:#b3261e;--clue-bg:#e6f6f3;--clue-bd:#68b0a8;--vote-bg:#fff0d6;--vote-bd:#e5a94c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.45 "Trebuchet MS","Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
header{background:var(--teal);color:#fff;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{margin:0;font-size:24px}
#score{font-size:16px;display:flex;gap:12px;flex-wrap:wrap}
#score span{background:rgba(255,255,255,.18);padding:2px 10px;border-radius:12px}
main{max-width:1120px;margin:0 auto;padding:14px 16px 32px}
h2{margin:6px 0 10px}
button{font:inherit;padding:13px 20px;border:0;border-radius:12px;background:var(--teal);color:#fff;margin:6px 6px 6px 0;cursor:pointer;touch-action:manipulation}
button.alt{background:#fff;color:var(--teal);border:2px solid var(--teal)}
button.sun{background:var(--sun);color:var(--ink)}
button.small{padding:4px 10px;font-size:14px;margin:4px 0 0 0}
:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.card{background:var(--card);border:3px dashed var(--teal);border-radius:20px;min-height:200px;display:flex;align-items:center;justify-content:center;font-size:40px;text-align:center;margin:12px 0;padding:16px;cursor:pointer}
.card.up{border-style:solid;background:#e8f4f2}
textarea{width:100%;font:inherit;padding:10px;border:2px solid var(--line);border-radius:10px;min-height:70px;user-select:text;-webkit-user-select:text}
#mic{background:var(--sun);color:var(--ink);width:100%;padding:24px;font-size:24px}
#mic.on{background:var(--bad);color:#fff}
.st{min-height:28px;color:var(--teal);margin:6px 0}
.err{color:var(--bad);font-weight:bold}
.grid{display:flex;flex-wrap:wrap}

/* Open board: sticky character headers + aligned round/statement rows */
.board-wrap{overflow-x:auto;margin:10px 0 16px}
.board-grid{display:grid;gap:8px;min-width:640px;align-items:start}
.sticky-top{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 4px 10px;border-bottom:2px solid var(--line)}
.char-cell{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 4px;border-radius:14px;transition:transform .15s,background .15s}
.char-cell.active{background:#fff1bd;box-shadow:0 0 0 2.5px var(--teal);transform:translateY(-2px)}
.char-cell.out{opacity:.45;filter:grayscale(.7)}
.char-badge{font-size:11px;font-weight:bold;background:var(--teal);color:#fff;border-radius:999px;padding:1px 8px;margin-bottom:3px}
.char-svg{width:76px;height:96px;display:block;overflow:visible}
.char-name{font-size:15px;font-weight:bold;margin-top:2px;line-height:1.2}
.char-meta{font-size:11px;color:#526664;line-height:1.2}

.row-label{font-size:12px;font-weight:bold;color:#415654;padding:6px 2px;border-top:1px dashed var(--line);display:flex;align-items:center;gap:6px}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.dot-clue{background:var(--clue-bd)}
.dot-vote{background:var(--vote-bd)}

.slot-cell{padding:4px 2px;border-top:1px dashed var(--line);min-height:54px}
.slot-cell.out{opacity:.45}
.bubble{border-radius:12px;padding:7px 9px;font-size:13px;line-height:1.32;word-break:break-word;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.bubble.clue{background:var(--clue-bg);border:1.5px solid var(--clue-bd);color:#153633}
.bubble.vote{background:var(--vote-bg);border:1.5px solid var(--vote-bd);color:#472c08}
.bubble.empty{background:transparent;border:1px dashed #d8cab0;color:#9b9486;font-size:12px;text-align:center;padding:8px 4px;box-shadow:none}
.bubble-tag{font-size:10px;font-weight:bold;text-transform:uppercase;letter-spacing:.03em;opacity:.72;margin-bottom:2px}
</style>
</head>

function voiceForName(name, preferred) {

  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return pool[h % pool.length];
}

// Group history chronologically into rows (each round's clues, each vote/defence step)
function buildRows() {
  if (!S || !S.hist || !S.hist.length) return [];
  const rows = [];
  let clueRow = null;

  for (const item of S.hist) {
    if (item.kind === 'clue') {
      if (!clueRow || clueRow.round !== item.round || item.name in clueRow.cells) {
        clueRow = { id: 'clue-' + item.round + '-' + rows.length, label: 'Round ' + item.round + ' Clues', type: 'clue', cells: {}, round: item.round };
        rows.push(clueRow);
      }
      clueRow.cells[item.name] = item.text;
    } else if (item.kind === 'defend') {
      clueRow = null;
      rows.push({
        id: 'defend-' + item.round + '-' + rows.length,
        label: 'Round ' + item.round + ' Defence',
        type: 'clue',
        cells: { [item.name]: item.text }
      });
    } else if (item.kind === 'vote') {
      clueRow = null;
      const lastVote = rows.length ? rows[rows.length - 1] : null;
      if (lastVote && lastVote.type === 'vote' && lastVote.round === item.round && !(item.name in lastVote.cells)) {
        lastVote.cells[item.name] = item.text;
      } else {
        rows.push({
          id: 'vote-' + item.round + '-' + rows.length,
          label: 'Round ' + item.round + ' Vote',
          type: 'vote',
          round: item.round,
          cells: { [item.name]: item.text }
        });
      }
    }
  }
  return rows;
}

function playerBoard(activeName, phaseLabel) {
  if (!S || !S.players || !S.players.length) return '';
  const n = S.players.length;
  const colsStyle = 'grid-template-columns: 118px repeat(' + n + ', minmax(138px, 1fr));';
  const rows = buildRows();

  let html = '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px;font-size:14px">' +
    '<span>' +
      '<span class="legend-dot dot-clue"></span> <b>Clue / Defence</b> &nbsp;&nbsp;' +
      '<span class="legend-dot dot-vote"></span> <b>Vote &amp; Reason</b>' +
    '</span>' +
    '<span style="font-weight:bold;color:var(--teal)">' + esc(phaseLabel || '') + '</span>' +
    '</div>';

  html += '<div class="board-wrap"><div class="board-grid" style="' + colsStyle + '">';

  // Sticky top row: corner + player characters
  html += '<div class="sticky-top" style="font-size:12px;font-weight:bold;color:#4f6361;display:flex;align-items:flex-end;padding-bottom:12px">Players</div>';
  S.players.forEach((p, idx) => {
    const isActive = activeName && p.name === activeName;
    html += '<div class="sticky-top char-cell' + (isActive ? ' active' : '') + (!p.alive ? ' out' : '') + '">' +
      '<div class="char-badge">#' + (idx + 1) + '</div>' +
      avatarSvg(p, isActive) +
      '<div class="char-name">' + esc(p.name) + '</div>' +
      '<div class="char-meta">' + (p.ai ? 'AI · ' + esc(p.gender) : 'Human') + (!p.alive ? ' · Out' : '') + '</div>' +
      '</div>';
  });

  // Grid rows below characters: each row = one round/step, each column = one player
  if (!rows.length) {
    html += '<div class="row-label">Round 1 Clues</div>';
    S.players.forEach(p => {
      html += '<div class="slot-cell' + (!p.alive ? ' out' : '') + '"><div class="bubble empty">' + (p.alive ? 'Not spoken yet' : 'Out') + '</div></div>';
    });
  } else {
    for (const r of rows) {
      const dotClass = r.type === 'vote' ? 'dot-vote' : 'dot-clue';
      html += '<div class="row-label"><span class="legend-dot ' + dotClass + '"></span><span>' + esc(r.label) + '</span></div>';
      for (const p of S.players) {
        const txt = r.cells[p.name];
        if (txt) {
          html += '<div class="slot-cell' + (!p.alive ? ' out' : '') + '">' +
            '<div class="bubble ' + r.type + '">' +
            '<div class="bubble-tag">' + (r.type === 'vote' ? 'Vote' : 'Clue') + '</div>' +
            esc(txt) +
            '</div></div>';
        } else {
          html += '<div class="slot-cell' + (!p.alive ? ' out' : '') + '"><div class="bubble empty">—</div></div>';
        }
      }
    }
  }

  html += '</div></div>';
  return html;
}

// ---------- screens ----------
function view(h) {
  $('main').innerHTML = h;
  $('main').querySelectorAll('[data-rp]').forEach(b => b.onclick = () => {
    const item = S.hist[+b.dataset.rp];
    if (item) speak(item);

}
function wait(h) {
  return new Promise(res => { view(h); $('main').querySelectorAll('[data-go]').forEach(b => b.onclick = () => res(b.dataset.go)); });
}
function replayButtons() {
  const aiItems = (S && S.hist ? S.hist : [])
    .map((e, i) => ({ e, i }))
    .filter(x => x.e.ai)
    .slice(-3);
  if (!aiItems.length) return '';
  return '<div style="margin:6px 0 10px">' +
    aiItems.map(x => '<button class="small alt" data-rp="' + x.i + '">Replay ' + esc(x.e.name) + '</button>').join(' ') +
    '</div>';
}

// ---------- audio ----------
async function speak(e) {
  const voice = voiceForName(e.name, e.voice);
  if (!e.audio) {
    try { e.audio = (await post('/tts', { text: e.text, voice, rate: +cfg.speech_rate })).audio_base64; $('tts').textContent = ''; }
    catch (err) { $('tts').textContent = 'Voice error: ' + err.message; return; }
  }
  new Audio('data:audio/mp3;base64,' + e.audio).play().catch(() => {});
}
let rec, chunks, stream;
async function startRec() {
  stream = stream || await navigator.mediaDevices.getUserMedia({ audio: true });
  chunks = [];
  rec = new MediaRecorder(stream);
  rec.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
  rec.start(250);
}
const stopRec = () => new Promise(r => { rec.onstop = () => r(new Blob(chunks)); rec.stop(); });
async function wavB64(blob) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const buf = await ctx.decodeAudioData(await blob.arrayBuffer());
  const oc = new OfflineAudioContext(1, Math.max(1, Math.ceil(buf.duration * 16000)), 16000);
  const src = oc.createBufferSource(); src.buffer = buf; src.connect(oc.destination); src.start();
  const d = (await oc.startRendering()).getChannelData(0), n = d.length;
  const v = new DataView(new ArrayBuffer(44 + n * 2)), w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 16000, true); v.setUint32(28, 32000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) { const s = Math.max(-1, Math.min(1, d[i])); v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
  const u = new Uint8Array(v.buffer); let b = '';
  for (let i = 0; i < u.length; i += 8192) b += String.fromCharCode.apply(null, u.subarray(i, i + 8192));
  return btoa(b);
}

// ---------- human speech: hold to talk, check text, confirm ----------
function humanSpeak(title, phaseLabel, activeName) {
  return new Promise(res => {
    view('<h2>' + esc(title) + '</h2>' +
      '<button id="mic">Hold to speak English</button><div class="st" id="st">Press and hold the yellow button, speak, then let go.</div>' +
      '<textarea id="tx" placeholder="Your words appear here. You can also type."></textarea><button id="ok">Confirm</button>' +
      replayButtons() + playerBoard(activeName, phaseLabel));
    const st = t => $('st').textContent = t, mic = $('mic');
    let holding = false;

    mic.onpointerdown = async e => {
      e.preventDefault();
      holding = true;
      try {
        mic.setPointerCapture(e.pointerId);
        await startRec();
        if (!holding) { await stopRec(); return; }
        mic.classList.add('on');
        st('Listening... let go when you finish.');
      } catch (err) {
        holding = false;
        st('Microphone problem: ' + err.message + '. You can type instead.');
      }
    };

    const finishHold = async () => {
      if (!holding) return;
      holding = false;
      mic.classList.remove('on');
      if (!rec || rec.state !== 'recording') return;
      st('Recognising...');
      try {
        const blob = await stopRec();
        if (!blob.size) { st('No audio captured. Hold a bit longer or type.'); return; }
        const r = await post('/asr', { audio_base64: await wavB64(blob) });
        const heard = (r.text || '').trim();
        if (heard) {
          $('tx').value = heard;
          st('Check the words. Fix them if needed, then press Confirm.');
        } else {
          console.log('ASR raw reply', r);
          st('Nothing recognised. Try again or type.');
        }
      } catch (err) {
        st('Could not recognise (' + err.message + '). You can type instead.');
      }
    };

    mic.onpointerup = finishHold;
    mic.onpointercancel = finishHold;
    $('ok').onclick = () => { const t = $('tx').value.trim(); if (t) res(t); else st('Say or type something first.'); };
  });
}

// ---------- game ----------
const alive = () => S.players.filter(p => p.alive);
const hist4ai = () => S.hist.filter(e => e.kind !== 'vote').map(e => ({ round: e.round, name: e.name, text: e.text, kind: e.kind }));

async function rest(table, query) {
  const r = await fetch('https://' + CFG.ENV + '.api.tcloudbasegateway.com/v1/rdb/rest/' + table + '?' + query, { headers: { Authorization: 'Bearer ' + CFG.KEY } });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && (j.message || j.error)) || 'Database error ' + r.status);
  return j;
}
async function loadAll() {
  cfg = (await rest('settings', 'select=*&id=eq.1'))[0];
  pairs = await rest('word_pairs', 'select=*');
}

async function lobby() {
  await loadAll();
  const total = cfg.human_count + cfg.ai_count;
  if (total < 3 || total > 8 || cfg.undercover_count > Math.floor((total - 1) / 2) || !pairs.length)
    return view('<h2>Not ready</h2><p class="err">Ask your teacher to check the settings and word list in the admin page.</p><button data-go="x" onclick="start()">Try again</button>');
  let names = '';
  for (let i = 0; i < cfg.human_count; i++) names += '<p>Player ' + (i + 1) + ': <input class="nm" value="Player ' + (i + 1) + '" maxlength="12" style="font:inherit;padding:6px"></p>';
  await wait('<h2>New game</h2><p>' + cfg.human_count + ' human and ' + cfg.ai_count + ' AI players, ' + cfg.undercover_count + ' undercover.</p>' + names +
    '<button data-go="go">Start</button><button class="alt" data-go="reset">Reset scores</button>').then(async a => {
    if (a === 'reset') { scores = {}; try { localStorage.removeItem('uc_scores'); } catch (e) {} drawScores(); return lobby(); }
    const hs = [...document.querySelectorAll('.nm')].map((i, k) => i.value.trim() || 'Player ' + (k + 1));
    if (new Set(hs).size < hs.length) return lobby();
    await play(hs);
  });
}

async function play(humanNames) {
  let fresh = pairs.filter(p => !used.has(p.id)); if (!fresh.length) { used.clear(); fresh = pairs; }
  const pr = fresh[Math.floor(Math.random() * fresh.length)]; used.add(pr.id);
  const flip = Math.random() < .5, cWord = flip ? pr.word_b : pr.word_a, uWord = flip ? pr.word_a : pr.word_b;

  const humanObjs = humanNames.map((n, idx) => {
    const g = guessGender(n);
    return {
      name: n,
      ai: false,
      gender: g,
      voice: voiceForName(n),
      shirt: idx % 2 === 0 ? '#3d5a80' : '#6d597a',
      hair: idx % 2 === 0 ? '#26211d' : '#3d2618',
      style: g === 'female' ? 'ponytail' : 'cap',
      blush: '#ffcad4'
    };
  });
  const aiObjs = AI_CAST.slice(0, cfg.ai_count).map(c => ({ ...c }));

  const ps = shuffle([...humanObjs, ...aiObjs]);
  const us = new Set(shuffle(ps.map((_, i) => i)).slice(0, cfg.undercover_count));
  ps.forEach((p, i) => { p.under = us.has(i); p.word = p.under ? uWord : cWord; p.alive = true; if (!(p.name in scores)) scores[p.name] = 0; });
  S = { players: ps, hist: [], cWord, uWord };
  drawScores();

  for (const p of ps.filter(p => !p.ai)) {   // secret cards
    await wait('<h2>' + esc(p.name) + ', this card is for you</h2><p>Nobody else should look.</p><button data-go="y">I am ' + esc(p.name) + '</button>');
    view('<h2>' + esc(p.name) + '</h2><div class="card" id="card">Tap to see your word</div><button data-go="h">Hide the card</button>');
    $('card').onclick = () => { $('card').textContent = p.word; $('card').classList.add('up'); };
    await new Promise(r => $('main').querySelector('[data-go]').onclick = r);
  }

  for (let round = 1; ; round++) {
    for (const p of alive()) await turn(p, round, 'clue');
    let cands = alive(), res = await vote(cands, round);
    if (res.tie) {
      for (const p of res.tie) await turn(p, round, 'defend');
      res = await vote(res.tie, round, true);
    }
    if (res.out) {
      res.out.alive = false;
      await wait('<h2>' + esc(res.out.name) + ' is out!</h2>' +
        '<p>Their word was <b>' + esc(res.out.word) + '</b>. They were ' + (res.out.under ? 'an UNDERCOVER' : 'a civilian') + '.</p><button data-go="n">Continue</button>' +
        playerBoard(res.out.name, 'Round ' + round + ' · Eliminated'));
    } else await wait('<h2>Tie again</h2>' +
      '<p>Nobody goes out this round.</p><button data-go="n">Continue</button>' +
      playerBoard(null, 'Round ' + round + ' · Tie'));
    const u = alive().filter(p => p.under).length, c = alive().length - u;
    if (u === 0) return finish('civilians');
    if (c <= u) return finish('undercovers');
  }
}

async function turn(p, round, kind) {
  const phase = kind === 'defend' ? ('Round ' + round + ' · Defence') : ('Round ' + round + ' · Clue');
  let text;
  if (p.ai) {
    view('<h2>' + esc(p.name) + ' is thinking...</h2>' + playerBoard(p.name, phase));
    text = (await post('/ai/speak', {
      name: p.name,
      word: p.word,
      level: cfg.difficulty,
      players: S.players.length,
      undercovers: cfg.undercover_count,
      history: hist4ai(),
      mode: kind === 'defend' ? 'defend' : 'speak'
    })).content;
  } else {
    text = await humanSpeak((kind === 'defend' ? 'Defend yourself, ' : 'Your turn, ') + p.name, phase, p.name);
  }
  const e = { round, name: p.name, text, ai: p.ai, voice: p.voice, kind };
  S.hist.push(e);
  if (p.ai) {
    speak(e);
    await wait('<h2>' + esc(p.name) + ' says:</h2><button data-go="n">Next</button>' + replayButtons() + playerBoard(p.name, phase));
  }
}

async function vote(cands, round, second) {
  const tally = {};
  const phase = (second ? 'Round ' + round + ' · Second Vote' : 'Round ' + round + ' · Voting');
  cands.forEach(c => tally[c.name] = 0);
  for (const v of alive()) {
    const opts = cands.filter(c => c !== v); if (!opts.length) continue;
    let target;
    if (v.ai) {
      view('<h2>' + esc(v.name) + ' is voting...</h2>' + playerBoard(v.name, phase));
      const r = await post('/ai/vote', { name: v.name, word: v.word, history: hist4ai(), candidates: opts.map(o => o.name) });
      target = r.target;
      const e = { round, name: v.name, text: 'I vote for ' + target + '. ' + r.reason, ai: true, voice: v.voice, kind: 'vote' };
      S.hist.push(e);
      speak(e);
      await wait('<h2>' + esc(v.name) + ' votes</h2><button data-go="n">Next</button>' + replayButtons() + playerBoard(v.name, phase));
    } else {
      target = await wait('<h2>' + esc(v.name) + ', who is the undercover?</h2>' +
        '<div class="grid">' + opts.map(o => '<button data-go="' + esc(o.name) + '">' + esc(o.name) + '</button>').join('') + '</div>' +
        replayButtons() + playerBoard(v.name, phase));
    }
    tally[target]++;
  }
  const max = Math.max(...Object.values(tally)), top = cands.filter(c => tally[c.name] === max);
  await wait('<h2>' + (second ? 'Second vote' : 'Votes') + '</h2>' +
    '<p>' + cands.map(c => esc(c.name) + ': ' + tally[c.name]).join('<br>') + '</p><button data-go="n">Continue</button>' +
    playerBoard(null, phase));
  if (top.length === 1) return { out: top[0] };
  return second ? { out: null } : { tie: top };
}

async function finish(winner) {
  const pts = [];
  S.players.forEach(p => { const win = winner === 'civilians' ? !p.under : p.under; if (win) { const n = p.under ? 4 : 2; addScore(p.name, n); pts.push(esc(p.name) + ' +' + n); } });
  await wait('<h2>' + (winner === 'civilians' ? 'Civilians win!' : 'Undercovers win!') + '</h2>' +
    '<p>Civilian word: <b>' + esc(S.cWord) + '</b><br>Undercover word: <b>' + esc(S.uWord) +
    '</b></p><p>Undercover: ' + S.players.filter(p => p.under).map(p => esc(p.name)).join(', ') + '</p><p>Points: ' + (pts.join(', ') || 'none') + '</p><button data-go="n">Next game</button>' +
    playerBoard(null, 'Game Over'));
  start();
}

async function start() {
  try { await lobby(); }
  catch (e) { await wait('<h2>Something went wrong</h2><p class="err">' + esc(e.message || String(e)) + '</p><button data-go="r">Start again</button>'); start(); }
}
drawScores();
start();
</script>
