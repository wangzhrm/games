<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Say &amp; Flip – Admin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f1ea;--ink:#1d2b2a;--card:#fff;--acc:#0f766e;--bad:#c2410c;--line:#d9d4c7}
@media(prefers-color-scheme:dark){:root{--bg:#14201f;--ink:#eef2ee;--card:#1d2d2b;--acc:#2dd4bf;--bad:#fb923c;--line:#35504d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;display:grid;grid-template-columns:270px 1fr;min-height:100vh}
@media(max-width:800px){body{grid-template-columns:1fr}}
aside{padding:18px;border-right:1px solid var(--line)}main{padding:18px;max-width:1000px}
h1{font-size:20px;margin:0 0 12px}h2{font-size:16px;margin:18px 0 8px}
input,textarea,button,select,.btn{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
button,.btn{cursor:pointer;display:inline-block}button.p{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
@media(prefers-color-scheme:dark){button.p{color:#06231f}}
button.d{color:var(--bad)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc)}
button:disabled{opacity:.5;cursor:wait}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.lst{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;background:var(--card);cursor:pointer}
.lst.on{border-color:var(--acc);box-shadow:inset 3px 0 var(--acc)}
#pa{display:none}
@media print{body{display:block;background:#fff;color:#000}aside,main,#msg{display:none!important}#pa{display:block}
#pa h1{font-size:22px;margin:0 0 12px}.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pc{border:1px solid #999;border-radius:8px;padding:8px;text-align:center;break-inside:avoid;font-size:15px}
.pc img,.pc .nb{width:100%;height:110px;object-fit:contain;display:block;margin-bottom:6px}.pc .nb{border:1px dashed #bbb;color:#999;font-size:11px;display:grid;place-items:center}}
.w{display:grid;grid-template-columns:140px 140px 64px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.w img,.ph{width:64px;height:64px;object-fit:contain;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.ph{display:grid;place-items:center;color:var(--bad);font-size:11px;text-align:center}
.w input[type=text]{width:100%}@media(max-width:700px){.w{grid-template-columns:1fr 1fr}}
#msg{position:fixed;bottom:14px;right:14px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;display:none;max-width:80vw}
textarea{width:100%;height:90px}details{margin-bottom:10px}
.hd{display:grid;grid-template-columns:140px 140px;gap:8px;font-size:12px;opacity:.7;margin-top:4px}
@media(max-width:700px){.hd{display:none}}
</style></head><body>
<aside>
<h1>Vocabulary lists</h1>
<details id="cfgbox"><summary>CloudBase connection</summary>
<div class="row"><input id="url" placeholder="CloudBase REST URL" style="width:100%"><input id="key" placeholder="anon / publishable key" style="width:100%"><button onclick="saveCfg()">Connect</button></div></details>
<button class="p" onclick="newList()" style="width:100%">+ New list</button>
<div id="lists"></div>
</aside>
<main>
<div class="row"><input id="name" placeholder="List name (e.g. Fruits)" style="flex:1;min-width:180px"><button class="p" onclick="save()">Save to CloudBase</button><button onclick="printList()">🖨 Print / save as PDF</button><button id="expBtn" onclick="exportXlsx()">⬇ Export Excel (English + Chinese)</button></div>
<h2>Add words</h2>
<textarea id="bulk" placeholder="One word per line. Optionally add the English meaning after a comma or tab, e.g.&#10;苹果, apple&#10;banana"></textarea>
<div class="row"><button onclick="addBulk()">Add typed words</button>
<label>or Excel/CSV (column A = word, column B = English meaning): <input type="file" accept=".xlsx,.xls,.csv" onchange="xl(this)"></label></div>
<h2>Words <span id="cnt"></span></h2>
<div class="row"><button onclick="findAll()">Find images for all missing</button><span id="prog"></span></div>
<div class="hd"><span>Word</span><span>English meaning</span></div>
<div id="words"></div>
</main><div id="msg"></div><div id="pa"></div>
<script>
const $=s=>document.querySelector(s);
const TCB_ENV='civil-prawn-d0gflguvzee35fad8';
const DEFAULT_CFG={
  url:`https://${TCB_ENV}.api.tcloudbasegateway.com/v1/rdb/rest`,
  key:'eyJhbGciOiJSUzI1NiIsImtpZCI6IjZkN2IyMmIyLWI4NjktNDNjNy04NGY0LWY0NTE2MDgxNDRhNSJ9.eyJpc3MiOiJodHRwczovL2NpdmlsLXByYXduLWQwZ2ZsZ3V2emVlMzVmYWQ4LmFwLXNoYW5naGFpLnRjYi1hcGkudGVuY2VudGNsb3VkYXBpLmNvbSIsInN1YiI6ImFub24iLCJhdWQiOiJjaXZpbC1wcmF3bi1kMGdmbGd1dnplZTM1ZmFkOCIsImV4cCI6NDA5ODg1NDQzMywiaWF0IjoxNzk1MTcxMjMzLCJub25jZSI6IlpOYXlDMXJ5VERxTmg1UFpFM0pxN3ciLCJhdF9oYXNoIjoiWk5heUMxcnlURHFOaDVQWkUzSnE3dyIsIm5hbWUiOiJBbm9ueW1vdXMiLCJzY29wZSI6ImFub255bW91cyIsInByb2plY3RfaWQiOiJjaXZpbC1wcmF3bi1kMGdmbGd1dnplZTM1ZmFkOCIsIm1ldGEiOnsicGxhdGZvcm0iOiJQdWJsaXNoYWJsZUtleSJ9LCJyb2xlIjoiYW5vbiIsImlzX2Fub255bW91cyI6dHJ1ZSwiYXBwX21ldGFkYXRhIjp7InByb3ZpZGVyIjoiYW5vbnltb3VzIiwicHJvdmlkZXJzIjpbImFub255bW91cyJdfSwidXNlcl9tZXRhZGF0YSI6eyJuYW1lIjoiQW5vbnltb3VzIn0sInVzZXJfdHlwZSI6IiIsImNsaWVudF90eXBlIjoiY2xpZW50X3VzZXIiLCJpc19zeXN0ZW1fYWRtaW4iOmZhbHNlfQ.udoyytgC9Z6QZjHnz7-v9rtM7K2C6PVYhVX9KgOrx76Q_j4phvYpItbrMc8eAfRiewAzXvyW2heL2U3mTofad8-q10i5R8TyJ6ZsR80qzsTs6CcAk699o3uAhB0E5QTa7GqEDrhlnVtu9Bi9-DroWgMMgV6CXgLCz-d0h1YQq1AReBNe1JNJv7MYMQG08YGmUEqgfgGlKwB-G7YJ5Ya6b3WLEVNLRBAPHOCMa8ExCiy9fAK1oDRyBlLq4ieH7pOaMriPYm7Y7C0XyemeLQ_0E5PDRPg9QNTCenwDG3usKCKV9hZGeiVmTKZHPYFBMgwM-iBlOslXPAjDW3Au8u85Jw'
};
let cfg=DEFAULT_CFG;
try{const s=JSON.parse(localStorage.tcbcfg_sayflip||'null');if(s&&s.url&&s.key)cfg=s}catch(e){}
let cur={id:null,words:[]},listsCache=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hasCJK=s=>/[\u3400-\u9fff\uf900-\ufaff]/.test(s||'');
const hasLatin=s=>/[A-Za-z]/.test(s||'');
function toast(t,ms=3500){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',ms)}
async function api(p,o={}){if(!cfg.url)throw Error('Enter your CloudBase REST URL and key first');
 const r=await fetch(cfg.url.replace(/\/$/,'')+'/'+p,{...o,headers:{apikey:cfg.key,Authorization:'Bearer '+cfg.key,'Content-Type':'application/json',Prefer:'return=representation',...o.headers}});
 if(!r.ok)throw Error(await r.text());return r.json().catch(()=>null)}
function saveCfg(){cfg={url:$('#url').value.trim(),key:$('#key').value.trim()};try{localStorage.tcbcfg_sayflip=JSON.stringify(cfg)}catch(e){}loadLists()}
async function loadLists(){try{
 const [ls,ws]=await Promise.all([api('lists?select=id,name&order=name'),api('words?select=id,list_id')]);
 const counts=new Map();
 ws.forEach(w=>counts.set(w.list_id,(counts.get(w.list_id)||0)+1));
 listsCache=ls.map(l=>({...l,count:counts.get(l.id)||0}));
 $('#lists').innerHTML=listsCache.map((l,i)=>`<div class="lst ${l.id==cur.id?'on':''}" onclick="openList(listsCache[${i}].id)"><span>${esc(l.name)} <small>(${l.count})</small></span><button class="d" title="Delete list" onclick="event.stopPropagation();delList(${i})">✕</button></div>`).join('')||'<p>No saved lists yet.</p>'}
 catch(e){$('#lists').innerHTML='<p>Not connected.</p>';toast(e.message)}}
async function printList(){const ws=cur.words.filter(w=>w.word);if(!ws.length)return toast('Open or create a list with words first');
 $('#pa').innerHTML=`<h1>${esc($('#name').value||'Vocabulary list')} (${ws.length} words)</h1><div class="pg">`+ws.map(w=>`<div class="pc">${w.url?`<img src="${esc(w.url)}" alt="">`:'<div class="nb">no image</div>'}<b>${esc(w.word)}</b></div>`).join('')+'</div>';
 toast('Loading images… choose "Save as PDF" in the print window',6000);
 await Promise.all([...document.querySelectorAll('#pa img')].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r})));window.print()}
function newList(){cur={id:null,words:[]};$('#name').value='';$('#bulk').value='';render();loadLists()}
async function getWords(id){
 // works whether or not the "meaning" column exists yet
 try{return await api(`words?list_id=eq.${id}&select=word,meaning,image_url,position`)}
 catch(e){toast('Tip: add a "meaning" column to the words table to store English meanings',7000);
  return await api(`words?list_id=eq.${id}&select=word,image_url,position`)}}
async function openList(id){try{
 const [d,ws]=await Promise.all([api(`lists?id=eq.${id}&select=id,name`),getWords(id)]);
 const l=d[0];cur={id:l.id,words:ws.sort((a,b)=>a.position-b.position).map(w=>({word:w.word,meaning:w.meaning||'',url:w.image_url||''}))};$('#name').value=l.name;$('#bulk').value=cur.words.map(w=>w.word).join('\n');render();loadLists()}catch(e){toast(e.message)}}
async function delList(i){const l=listsCache[i];if(!l||!confirm('Delete list "'+l.name+'" and all its words?'))return;try{await api('words?list_id=eq.'+l.id,{method:'DELETE'});await api('lists?id=eq.'+l.id,{method:'DELETE'});if(cur.id==l.id)newList();else loadLists()}catch(e){toast(e.message)}}
function setUrl(i,v){v=v.trim();if(v==='(uploaded image)')return;cur.words[i].url=v;render()}
function render(){$('#cnt').textContent='('+cur.words.length+')';
 $('#words').innerHTML=cur.words.map((w,i)=>`<div class="w"><input type="text" value="${esc(w.word)}" onchange="cur.words[${i}].word=this.value.trim()">
 <input type="text" placeholder="English meaning" value="${esc(w.meaning)}" onchange="cur.words[${i}].meaning=this.value.trim()">
 ${w.url?`<img src="${esc(w.url)}" alt="">`:`<div class="ph">${w.miss?'not found':'no image'}</div>`}
 <div class="row" style="margin:0"><input type="text" placeholder="Image URL" value="${w.url.startsWith('data:')?'(uploaded image)':esc(w.url)}" style="flex:1;min-width:120px" onchange="setUrl(${i},this.value)">
 <button onclick="findOne(${i}).then(render)">Find</button><label class="btn">Upload<input type="file" accept="image/*" hidden onchange="upl(${i},this)"></label></div>
 <button class="d" onclick="cur.words.splice(${i},1);render()">Remove</button></div>`).join('')}

// items can be a string ("apple") or [word, meaning]
function addWords(a){
 const idx=new Map(cur.words.map(w=>[w.word.toLowerCase(),w]));
 a.forEach(x=>{
  const word=String(Array.isArray(x)?x[0]:x??'').trim();
  const meaning=String(Array.isArray(x)?(x[1]??''):'').trim();
  if(!word)return;
  const ex=idx.get(word.toLowerCase());
  if(ex){if(meaning&&!ex.meaning)ex.meaning=meaning;return}
  const nw={word,meaning,url:''};cur.words.push(nw);idx.set(word.toLowerCase(),nw)});
 render()}
function addBulk(){
 addWords($('#bulk').value.split(/\n/).map(l=>{const m=l.match(/^([^\t,，]+)[\t,，]\s*(.*)$/);return m?[m[1],m[2]]:l}));
 $('#bulk').value=''}
function xl(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=e=>{try{
  const wb=XLSX.read(e.target.result,{type:'array'});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})
   .filter(r=>r.some(c=>String(c).trim()));
  const H=/^(english|vocabulary|vocab|word|words|chinese|meaning|english meaning|definition|translation|中文|英文|单词|單字|詞彙|词汇|意思|解释|解釋)$/i;
  if(rows.length&&(H.test(String(rows[0][0]).trim())||H.test(String(rows[0][1]??'').trim())))rows.shift();
  const before=cur.words.length;
  addWords(rows.map(r=>[r[0],r[1]]));
  const withM=rows.filter(r=>String(r[1]??'').trim()).length;
  toast(`Added ${cur.words.length-before} new word(s); ${withM} row(s) had a meaning in column B. Remember to click Save.`,6000);
 }catch(err){toast('Could not read file: '+err.message,6000)}
 inp.value=''};r.readAsArrayBuffer(f)}

const SET='fluent-emoji-flat';
// pick the English text to use for image search
function searchTerm(w){
 if(hasCJK(w.word)&&hasLatin(w.meaning))return w.meaning;
 if(hasLatin(w.word))return w.word;
 return w.meaning||w.word}
async function findOne(i){const w=cur.words[i];try{
 const r=await(await fetch(`https://api.iconify.design/search?query=${encodeURIComponent(searchTerm(w))}&prefixes=${SET}&limit=1`)).json();
 if(r.icons&&r.icons.length){const [p,n]=r.icons[0].split(':');w.url=`https://api.iconify.design/${p}/${n}.svg`;w.miss=false}else w.miss=true}catch(e){w.miss=true}}
async function findAll(){let n=0;const todo=cur.words.map((w,i)=>i).filter(i=>!cur.words[i].url);
 for(const i of todo){$('#prog').textContent=`Searching ${++n}/${todo.length}…`;await findOne(i)}
 $('#prog').textContent='';render();toast(cur.words.filter(w=>!w.url).length+' word(s) still need a manual image')}
function upl(i,inp){const f=inp.files[0];if(!f)return;const im=new Image();im.onload=()=>{const s=256/Math.max(im.width,im.height,256),c=document.createElement('canvas');
 c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cur.words[i].url=c.toDataURL('image/png');render()};im.src=URL.createObjectURL(f)}
async function save(){const name=$('#name').value.trim();if(!name)return toast('Give the list a name');
 const ws=cur.words.filter(w=>w.word);if(!ws.length)return toast('Add at least one word');
 try{if(cur.id){await api('lists?id=eq.'+cur.id,{method:'PATCH',body:JSON.stringify({name})});await api('words?list_id=eq.'+cur.id,{method:'DELETE'})}
 else{const d=await api('lists',{method:'POST',body:JSON.stringify({name})});cur.id=d[0].id}
 const mk=withM=>ws.map((w,i)=>({list_id:cur.id,word:w.word,...(withM?{meaning:w.meaning||null}:{}),image_url:w.url||null,position:i}));
 let warn=false;
 try{await api('words',{method:'POST',body:JSON.stringify(mk(true))})}
 catch(e){if(!/meaning/i.test(e.message))throw e;
  await api('words',{method:'POST',body:JSON.stringify(mk(false))});warn=true}
 toast(warn?'Saved words, but meanings were NOT stored: add a "meaning" (text) column to the words table, then save again.':'Saved "'+name+'"',warn?10000:3500);
 loadLists()}catch(e){toast(e.message,7000)}}

async function exportXlsx(){
 const ws=cur.words.filter(w=>w.word);
 if(!ws.length)return toast('Open a list with words first');
 const btn=$('#expBtn');btn.disabled=true;
 const rows=[['English','Chinese']];let n=0,fail=0;
 for(const w of ws){
  $('#prog').textContent=`Preparing ${++n}/${ws.length}…`;
  const en=(hasCJK(w.word)&&w.meaning)?w.meaning:w.word;
  let zh=hasCJK(w.word)?w.word:(hasCJK(w.meaning)?w.meaning:'');
  if(!zh){
   try{
    const r=await(await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(en)+'&langpair=en|zh-CN')).json();
    zh=r.responseData?.translatedText||'';
    if(/MYMEMORY WARNING|INVALID|QUERY LENGTH/i.test(zh))zh='';
   }catch(e){}
  }
  if(!zh)fail++;
  rows.push([en,zh]);
 }
 $('#prog').textContent='';btn.disabled=false;
 const wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Vocab');
 XLSX.writeFile(wb,($('#name').value.trim()||'vocab').replace(/[\\/:*?"<>|]/g,'_')+'.xlsx');
 toast('Exported '+ws.length+' words'+(fail?' ('+fail+' blank translations)':'')+'. Please check the Chinese column before importing.',8000);
}

$('#url').value=cfg.url||'';$('#key').value=cfg.key||'';if(!cfg.url)$('#cfgbox').open=true;else{loadLists()}render();
</script></body></html>
